[project]
name = "hyprtheme-build"
version = "0.1.0"
description = "Build-time asset generator for hyprtheme themes -- turns a theme's raw [palette] into a Kvantum theme + KDE .colors file. A separate package from hyprtheme itself: only theme authors need this, not everyday theme switching."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hyprtheme",
]

[project.scripts]
hyprtheme-build = "hyprtheme_build.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyprtheme_build"]
