# Per-installation app config for hyprtheme (see hyprtheme/README.md for
# the format). Paths assume this repo is cloned to ~/Projects/dotmanager,
# matching the top-level README's fresh-install instructions -- adjust if
# yours lives elsewhere.
#
# gtk/icon share live_push="nwg-look" so nwg-look's export step runs once
# for both, not twice (see hyprtheme's manager.py docstring). Order here
# also matters: gtk/icon come first so their nwg-look push happens before
# waybar's restart, which needs GTK to have already re-resolved the theme
# for native widgets it doesn't style itself (the tray popup menu).

[apps.gtk]
kind = "plugin"
plugin = "gtk"
live_push = "nwg-look"
gsettings_file = "~/Projects/dotmanager/dotfiles/dot_local/.local/share/nwg-look/gsettings"
theme_dirs = ["/usr/share/themes", "~/.local/share/themes"]

[apps.icon]
kind = "plugin"
plugin = "icon"
live_push = "nwg-look"
gsettings_file = "~/Projects/dotmanager/dotfiles/dot_local/.local/share/nwg-look/gsettings"
assets_dir = "~/Projects/dotmanager/assets/icon-themes"

[apps.kitty]
kind = "pointer"
theme_key = "kitty_theme"
target = "~/Projects/dotmanager/dotfiles/kitty/.config/kitty/current-theme.conf"
source = "themes/{value}.conf"
pointer_format = "include themes/{value}.conf\n"
reload = ["pkill", "-USR1", "-x", "kitty"]
ok_reload_codes = [0, 1]

[apps.waybar]
kind = "copy"
theme_key = "waybar_theme"
target = "~/Projects/dotmanager/dotfiles/waybar/.config/waybar/colors/current.css"
source = "{value}.css"
reload = ["/bin/sh", "-c", "pkill -x waybar; sleep 0.3; setsid waybar >/dev/null 2>&1 </dev/null &"]

[apps.rofi]
kind = "copy"
theme_key = "rofi_theme"
target = "~/Projects/dotmanager/dotfiles/rofi/.config/rofi/colors/current.rasi"
source = "{value}.rasi"

[apps.swaync]
kind = "pointer"
theme_key = "swaync_theme"
target = "~/Projects/dotmanager/dotfiles/swaync/.config/swaync/style.css"
source = "themes/{value}.css"
pointer_format = "/* Rewritten by hyprtheme on `dotmanager theme set`. */\n@import 'themes/{value}.css';\n"
reload = ["swaync-client", "--reload-css"]
ok_reload_codes = [0, 1, 2]

[apps.lsd]
kind = "copy"
theme_key = "lsd_theme"
target = "~/Projects/dotmanager/dotfiles/lsd/.config/lsd/colors.yaml"
source = "colors/{value}.yaml"

[apps.nvim]
kind = "write"
theme_key = "nvim_theme"
target = "~/Projects/dotmanager/dotfiles/nvim/.config/nvim/lua/config/current-theme.lua"
pointer_format = "-- Rewritten by hyprtheme on `dotmanager theme set`.\nreturn \"{value}\"\n"

[apps.qt]
kind = "plugin"
plugin = "qt"
kvantum_dir = "~/.config/Kvantum"
generated_kvantum_dir = "~/Projects/dotmanager/assets/generated/kvantum"
kdeglobals = "~/.config/kdeglobals"
generated_colors_dir = "~/Projects/dotmanager/assets/generated/color-schemes"
platform_engine_conf = "~/.config/hypr/hyprqt6engine.conf"
style = "kvantum"

[apps.herdr]
kind = "plugin"
plugin = "herdr"
config_file = "~/Projects/dotmanager/dotfiles/herdr/.config/herdr/config.toml"

[apps.claude]
kind = "plugin"
plugin = "claude"
