# The basic colors
foreground              #24292f
background              #ffffff
selection_foreground    #ffffff
selection_background    #0969da

# Cursor colors
cursor                  #0969da
cursor_text_color       #ffffff

# URL underline color when hovering with mouse
url_color               #0969da

# Kitty window border colors
active_border_color     #0969da
inactive_border_color   #d0d7de
bell_border_color       #4d2d00

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #24292f
active_tab_background   #ffffff
inactive_tab_foreground #57606a
inactive_tab_background #f6f8fa
tab_bar_background      #f6f8fa

# Colors for marks (marked text in the terminal)
mark1_foreground #ffffff
mark1_background #0969da
mark2_foreground #ffffff
mark2_background #8250df
mark3_foreground #ffffff
mark3_background #1b7c83

