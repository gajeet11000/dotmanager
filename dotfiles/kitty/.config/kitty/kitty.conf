font_size 16
font_family CaskaydiaCove NF
linux_display_server wayland
bold_font auto
italic_font auto
bold_italic_font auto
background_opacity 0.9
background_blur 1
cursor_trail 1
cursor_trail_decay 0.05 0.2

# Position of the tab bar. Can be: top, bottom, left, right
tab_bar_edge top


# Tab Navigation (Vim-style)
# map ctrl+alt+l next_tab
# map ctrl+alt+h previous_tab


# Colorscheme -- swapped by `dotmanager theme set`, see
# core/theme_appliers/kitty_theme.py. Points at one of themes/*.conf.
include current-theme.conf
