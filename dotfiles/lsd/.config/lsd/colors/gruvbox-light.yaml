# lsd color theme -- Gruvbox Light. RGB triples match the palette used in
# dotfiles/kitty/.config/kitty/themes/gruvbox-light.conf. Deliberately uses
# darker/more-saturated tones than the dark variant -- lsd's own default
# theme is dark-background-only (pale colors like Cornsilk1 for `user`),
# which is exactly why user/group were nearly invisible against a light
# background before this theme existed. Note: lsd hardcodes its
# directory/file/symlink/device colors (the `file-type` section is not
# user-configurable), so those aren't set here.
user: [181, 118, 20]     # dark yellow
group: [66, 123, 88]     # dark aqua/green

permission:
  read: [121, 116, 14]        # dark green
  write: [181, 118, 20]       # dark yellow
  exec: [157, 0, 6]           # dark red
  exec-sticky: [143, 63, 113] # dark purple
  no-access: [124, 111, 100]  # dark grey
  octal: [66, 123, 88]        # dark aqua
  acl: [7, 102, 120]          # dark cyan
  context: [7, 102, 120]      # dark cyan

attributes:
  archive: [121, 116, 14]     # dark green
  read: [181, 118, 20]        # dark yellow
  hidden: [143, 63, 113]      # dark purple
  system: [143, 63, 113]      # dark purple

date:
  hour-old: [121, 116, 14]    # dark green
  day-old: [181, 118, 20]     # dark yellow
  older: [124, 111, 100]      # dark grey

size:
  none: [124, 111, 100]       # dark grey
  small: [60, 56, 54]         # fg
  medium: [181, 118, 20]      # dark yellow
  large: [175, 58, 3]         # dark orange

inode:
  valid: [143, 63, 113]       # dark purple
  invalid: [124, 111, 100]    # dark grey

tree-edge: [124, 111, 100]    # dark grey

links:
  valid: [143, 63, 113]       # dark purple
  invalid: [124, 111, 100]    # dark grey

git-status:
  default: [124, 111, 100]        # dark grey
  unmodified: [124, 111, 100]     # dark grey
  ignored: [124, 111, 100]        # dark grey
  new-in-index: [121, 116, 14]    # dark green
  new-in-workdir: [121, 116, 14]  # dark green
  typechange: [181, 118, 20]      # dark yellow
  deleted: [157, 0, 6]            # dark red
  renamed: [121, 116, 14]         # dark green
  modified: [181, 118, 20]        # dark yellow
  conflicted: [157, 0, 6]         # dark red
