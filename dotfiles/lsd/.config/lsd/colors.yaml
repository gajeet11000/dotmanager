# lsd color theme -- GitHub Light. RGB triples match the palette used in
# dotfiles/kitty/.config/kitty/themes/github-light.conf (sourced from
# GitHub's own theme in kovidgoyal/kitty-themes). Note: lsd hardcodes its
# directory/file/symlink/device colors (the `file-type` section is not
# user-configurable), so those aren't set here.
user: [77, 45, 0]        # yellow (dark, for contrast on white)
group: [27, 124, 131]    # cyan

permission:
  read: [26, 127, 55]         # green
  write: [77, 45, 0]          # yellow
  exec: [207, 34, 46]         # red
  exec-sticky: [130, 80, 223] # magenta
  no-access: [110, 119, 129]  # grey (color7)
  octal: [27, 124, 131]       # cyan
  acl: [9, 105, 218]          # blue
  context: [9, 105, 218]      # blue

attributes:
  archive: [26, 127, 55]      # green
  read: [77, 45, 0]           # yellow
  hidden: [130, 80, 223]      # magenta
  system: [130, 80, 223]      # magenta

date:
  hour-old: [26, 127, 55]     # green
  day-old: [77, 45, 0]        # yellow
  older: [110, 119, 129]      # grey

size:
  none: [110, 119, 129]       # grey
  small: [36, 41, 47]         # fg
  medium: [77, 45, 0]         # yellow
  large: [207, 34, 46]        # red

inode:
  valid: [130, 80, 223]       # magenta
  invalid: [110, 119, 129]    # grey

tree-edge: [110, 119, 129]    # grey

links:
  valid: [130, 80, 223]       # magenta
  invalid: [110, 119, 129]    # grey

git-status:
  default: [110, 119, 129]        # grey
  unmodified: [110, 119, 129]     # grey
  ignored: [110, 119, 129]        # grey
  new-in-index: [26, 127, 55]     # green
  new-in-workdir: [26, 127, 55]   # green
  typechange: [77, 45, 0]         # yellow
  deleted: [207, 34, 46]          # red
  renamed: [26, 127, 55]          # green
  modified: [77, 45, 0]           # yellow
  conflicted: [207, 34, 46]       # red
