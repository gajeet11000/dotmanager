onboarding = false

[theme]
name = "one-light"

[theme.custom]
accent = "#8839ef"
panel_bg = "#eff1f5"
surface0 = "#ccd0da"
surface1 = "#bcc0cc"
surface_dim = "#acb0be"
overlay0 = "#9ca0b0"
overlay1 = "#8c8fa1"
text = "#4c4f69"
subtext0 = "#6c6f85"
mauve = "#8839ef"
green = "#40a02b"
yellow = "#df8e1d"
red = "#d20f39"
blue = "#1e66f5"
teal = "#179299"
peach = "#fe640b"

[keys]
prefix = "ctrl+s"
new_tab = ["prefix+c", "ctrl+alt+t"]
previous_tab = ["prefix+h", "ctrl+alt+h"]
next_tab = ["prefix+l", "ctrl+alt+l"]
split_vertical = ["prefix+v", "ctrl+alt+="]
split_horizontal = ["prefix+minus", "ctrl+alt+-"]
zoom = ["prefix+z", "ctrl+f"]
close_pane = ["prefix+x", "ctrl+x"]
close_tab = ["prefix+shift+x", "ctrl+alt+x"]


[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"

[ui]
agent_panel_sort = "spaces"
